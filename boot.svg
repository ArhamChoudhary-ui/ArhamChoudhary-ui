<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="ArhamOS boot sequence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <style>
    .ln { font-family: "SF Mono","Fira Code","DejaVu Sans Mono",Menlo,Consolas,monospace;
           font-size: 14px; letter-spacing: 0.2px; }
    .etch { font-family: "SF Mono","DejaVu Sans Mono",monospace; font-size: 10px;
             letter-spacing: 2.4px; fill: #5c5274; }
    .brand { font-family: "SF Mono","DejaVu Sans Mono",monospace; font-size: 13px;
              letter-spacing: 3px; fill: #ffb000; }
  </style>

  <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b3350"/>
    <stop offset="0.5" stop-color="#2a2438"/>
    <stop offset="1" stop-color="#1e1a2b"/>
  </linearGradient>

  <radialGradient id="vign" cx="0.5" cy="0.45" r="0.78">
    <stop offset="0.45" stop-color="#17121f" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
  </radialGradient>

  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000000" opacity="0.30"/>
  </pattern>

  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="screen">
    <rect x="30" y="26" width="840" height="386" rx="16"/>
  </clipPath>
</defs>

<!-- monitor shell -->
<rect x="4" y="4" width="892" height="462" rx="26" fill="url(#bezel)"/>
<rect x="4.5" y="4.5" width="891" height="461" rx="26" fill="none" stroke="#554a70" stroke-width="1"/>

<!-- screen well -->
<rect x="30" y="26" width="840" height="386" rx="16" fill="#14101c"/>

<g clip-path="url(#screen)" filter="url(#glow)">
  <!-- header rule -->
  <text x="58" y="58" class="brand">ARHAM-OS</text>
  <line x1="58" y1="70" x2="842" y2="70" stroke="#4a3f66" stroke-width="1"/>

  <clipPath id="c0"><rect x="58" y="78" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;386;386;0;0" keyTimes="0;0.0400;0.0667;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="92" clip-path="url(#c0)" class="ln" fill="#8a7ca8">ARHAM WORKSTATION  //  ROM BIOS v2.6</text>
  <clipPath id="c1"><rect x="58" y="99" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;251;251;0;0" keyTimes="0;0.0771;0.1039;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="113" clip-path="url(#c1)" class="ln" fill="#8a7ca8">64K PHOSPHOR BUFFER OK</text>
  <clipPath id="c3"><rect x="58" y="141" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;395;395;0;0" keyTimes="0;0.1514;0.1782;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="155" clip-path="url(#c3)" class="ln" fill="#ffb000">mount  /dev/curiosity ............ ok</text>
  <clipPath id="c4"><rect x="58" y="162" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;395;395;0;0" keyTimes="0;0.1886;0.2153;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="176" clip-path="url(#c4)" class="ln" fill="#ffb000">mount  /dev/build-loop ........... ok</text>
  <clipPath id="c5"><rect x="58" y="183" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;395;395;0;0" keyTimes="0;0.2257;0.2525;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="197" clip-path="url(#c5)" class="ln" fill="#ffb000">load   prototype-to-repo.ko ...... ok</text>
  <clipPath id="c6"><rect x="58" y="204" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;395;395;0;0" keyTimes="0;0.2629;0.2896;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="218" clip-path="url(#c6)" class="ln" fill="#ffb000">load   break-it-deliberately.ko .. ok</text>
  <clipPath id="c7"><rect x="58" y="225" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;462;462;0;0" keyTimes="0;0.3000;0.3267;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="239" clip-path="url(#c7)" class="ln" fill="#ff5f56">load   comfort-zone.ko ........... not found</text>
  <clipPath id="c9"><rect x="58" y="267" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;443;443;0;0" keyTimes="0;0.3743;0.4010;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="281" clip-path="url(#c9)" class="ln" fill="#ffb000">starting faultline.service ....... running</text>
  <clipPath id="c10"><rect x="58" y="288" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;443;443;0;0" keyTimes="0;0.4114;0.4382;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="302" clip-path="url(#c10)" class="ln" fill="#ffb000">starting second-take.service ..... running</text>
  <clipPath id="c11"><rect x="58" y="309" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;443;443;0;0" keyTimes="0;0.4486;0.4753;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="323" clip-path="url(#c11)" class="ln" fill="#ffb000">starting reviewiq.service ........ running</text>
  <clipPath id="c13"><rect x="58" y="351" width="0" height="20">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;414;414;0;0" keyTimes="0;0.5229;0.5496;0.94;0.985;1" calcMode="linear"/>
  </rect></clipPath>
  <text x="58" y="365" clip-path="url(#c13)" class="ln" fill="#ffe3a3">arham-os ready. 6 repositories mounted.</text>

  <!-- blinking cursor after last line -->
  <rect x="440.4" y="353" width="9" height="16" fill="#ffe3a3">
    <animate attributeName="opacity" dur="15.0s" repeatCount="indefinite"
             values="0;0;1;0;1;0;1;0;1;0" keyTimes="0;0.56;0.60;0.66;0.72;0.78;0.84;0.90;0.94;1"/>
  </rect>

  <!-- progress rail -->
  <rect x="58" y="382" width="784" height="4" rx="2" fill="#2e2742"/>
  <rect x="58" y="382" width="0" height="4" rx="2" fill="#ffb000">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite"
             values="0;0;784;784;0;0" keyTimes="0;0.0400;0.5800;0.94;0.985;1" calcMode="linear"/>
  </rect>
</g>

<!-- scanlines + vignette on top of everything inside the screen -->
<g clip-path="url(#screen)">
  <rect x="30" y="26" width="840" height="386" fill="url(#scan)"/>
  <rect x="30" y="26" width="840" height="386" fill="url(#vign)"/>
  <!-- slow drifting refresh band -->
  <rect x="30" y="0" width="840" height="46" fill="#ffb000" opacity="0.035">
    <animate attributeName="y" dur="7s" repeatCount="indefinite" values="-46;412" calcMode="linear"/>
  </rect>
</g>

<!-- bezel etching -->
<text x="76" y="444" class="etch">ARHAM WORKSTATION 2600</text>
<text x="842" y="444" class="etch" text-anchor="end">PHOSPHOR / AMBER</text>

<!-- power LED -->
<circle cx="58" cy="440" r="4" fill="#ffb000">
  <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.35;1;0.35"/>
</circle>
</svg>
