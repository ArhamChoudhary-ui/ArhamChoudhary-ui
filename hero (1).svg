<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04050A"/>
      <stop offset="0.48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#071A1C"/>
    </linearGradient>
    <linearGradient id="neon" x1="110" y1="285" x2="1050" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#fff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1018px 137px; }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 1018px 137px; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.34; transform:scale(.82); } 50% { opacity:.92; transform:scale(1.1); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes scan { 0% { transform:translateX(-230px); opacity:0; } 15% { opacity:1; } 70% { opacity:.8; } 100% { transform:translateX(1430px); opacity:0; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
    <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
    <circle cx="1018" cy="137" r="150" fill="#22D3EE" fill-opacity="0.035" filter="url(#soft)"/>
    <path d="M-40 304C112 252 178 313 328 265C478 217 536 292 684 234C821 180 902 228 1052 164C1110 139 1162 119 1242 101" stroke="url(#neon)" stroke-width="2" stroke-opacity=".72"/>
    <path d="M-40 311C112 259 178 320 328 272C478 224 536 299 684 241C821 187 902 235 1052 171C1110 146 1162 126 1242 108" stroke="#22D3EE" stroke-width="18" stroke-opacity=".035"/>
    <g class="scan">
      <rect x="-240" y="24" width="220" height="1" fill="url(#line)"/>
      <rect x="-240" y="25" width="220" height="42" fill="url(#line)" opacity=".06"/>
    </g>
    <g class="mono">
      <text x="70" y="60" fill="#64748B" font-size="14" letter-spacing="4">ARHAM // PERSONAL SYSTEM</text>
      <circle cx="370" cy="55" r="4" fill="#34D399" filter="url(#glow)"/>
      <text x="385" y="60" fill="#6EE7B7" font-size="12" letter-spacing="2">ONLINE</text>
      <text x="70" y="132" fill="#F8FAFC" font-size="47" font-weight="700" letter-spacing="1">I BUILD SYSTEMS</text>
      <text x="70" y="182" fill="url(#neon)" font-size="47" font-weight="700" letter-spacing="1">THAT FEEL ALIVE.</text>
      <text x="72" y="216" fill="#94A3B8" font-size="16">devtools · AI workflows · interfaces · automation · experiments</text>
      <rect x="70" y="252" width="190" height="34" rx="9" fill="#A78BFA" fill-opacity=".11" stroke="#A78BFA" stroke-opacity=".42"/>
      <text x="87" y="274" fill="#DDD6FE" font-size="12" letter-spacing="1">FAULTS → EVIDENCE</text>
      <rect x="272" y="252" width="178" height="34" rx="9" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".42"/>
      <text x="289" y="274" fill="#A5F3FC" font-size="12" letter-spacing="1">IDEAS → SYSTEMS</text>
      <rect x="462" y="252" width="174" height="34" rx="9" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".42"/>
      <text x="479" y="274" fill="#A7F3D0" font-size="12" letter-spacing="1">SYSTEMS → SHIPPED</text>
      <text x="70" y="329" fill="#475569" font-size="11" letter-spacing="2">PROFILE CONSOLE / v2.0</text>
      <text x="834" y="329" fill="#475569" font-size="11" letter-spacing="2">ARHAMCHOUDHARY-UI</text>
    </g>
    <g class="orbit" opacity=".78">
      <circle cx="1018" cy="137" r="78" stroke="#22D3EE" stroke-opacity=".26" stroke-dasharray="2 11"/>
      <circle cx="1018" cy="137" r="105" stroke="#A78BFA" stroke-opacity=".2" stroke-dasharray="1 16"/>
      <circle cx="1018" cy="137" r="130" stroke="#34D399" stroke-opacity=".18" stroke-dasharray="1 22"/>
      <circle cx="1018" cy="59" r="4" fill="#22D3EE" filter="url(#glow)"/>
      <circle cx="1123" cy="137" r="4" fill="#A78BFA" filter="url(#glow)"/>
      <circle cx="1018" cy="267" r="4" fill="#34D399" filter="url(#glow)"/>
    </g>
    <circle class="pulse" cx="1018" cy="137" r="43" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".42"/>
    <circle cx="1018" cy="137" r="16" fill="#071A1C" stroke="#34D399" stroke-width="2" filter="url(#glow)"/>
    <circle cx="1018" cy="137" r="5" fill="#ECFDF5"/>
    <g class="mono">
      <text x="960" y="205" fill="#A5F3FC" font-size="11" letter-spacing="2">SIGNAL LOCKED</text>
      <text x="956" y="222" fill="#64748B" font-size="10">curiosity // active</text>
    </g>
